name: Backend CD to EC2 for dev

permissions: 
  id-token: write
  contents: read

on:
  push:
    branches: [ "develop-be" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  WORKING_DIR: backend
  SPRING_PROFILES_ACTIVE: dev

jobs:
  build:
    name: Build and Upload Artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
        ports:
          - 13307:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build executable Spring Boot jar
        run: ./gradlew clean bootJar

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Image Build & Push
        run: |
          if ! docker buildx inspect ci-builder &>/dev/null; then
            docker buildx create --use --name ci-builder
          else
            docker buildx use ci-builder
          fi
          docker buildx build \
            --platform linux/arm64,linux/amd64 \
            --build-arg ENVIRONMENT=${{ env.SPRING_PROFILES_ACTIVE }} \
            --cache-from=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/travelog:buildcache \
            --cache-to=type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/travelog:buildcache,mode=max \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/travelog:dev \
            --push .
      
  deploy:
    needs: build
    if: |
      needs.build.result == 'success'
    runs-on: [ self-hosted, travelog-dev ]

    steps:
      -  name: Login to Docker Hub (for Pull)
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy
        run: |
          cat <<EOF > .env.tmp
          MYSQL_USERNAME=${{ secrets.MYSQL_USERNAME }}
          MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
          MYSQL_PORT=${{ secrets.MYSQL_PORT }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          MYSQL_ENDPOINT=${{ secrets.MYSQL_ENDPOINT }}
          KAKAO_REST_API_KEY=${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET=${{ secrets.KAKAO_CLIENT_SECRET }}
          JWT_REFRESH_SECRET_KEY=${{ secrets.JWT_REFRESH_SECRET_KEY }}
          JWT_REFRESH_EXPIRATION=${{ secrets.JWT_REFRESH_EXPIRATION }}
          JWT_ACCESS_SECRET_KEY=${{ secrets.JWT_ACCESS_SECRET_KEY }}
          JWT_ACCESS_EXPIRATION=${{ secrets.JWT_ACCESS_EXPIRATION }}
          AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
          AWS_IMAGE_BASE_URI=${{ secrets.AWS_IMAGE_BASE_URI }}
          OTLP_TRACING_ENDPOINT=${{ secrets.OTLP_TRACING_ENDPOINT }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          SWAGGER_SERVERS_LOCAL=${{ secrets.SWAGGER_SERVERS_LOCAL }}
          SWAGGER_SERVERS_DEV=${{ secrets.SWAGGER_SERVERS_DEV }}
          SWAGGER_SERVERS_PROD=${{ secrets.SWAGGER_SERVERS_PROD }}
          LLM_GEMINI_API_KEY=${{ secrets.LLM_GEMINI_API_KEY }}
          EOF
          
          
          mv .env.tmp /home/test/travelog/.env
          
          cd /home/test/travelog/ 
          chmod +x deploy.sh          
          ./deploy.sh


            
