server:
  port: 8081

spring:
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test
    username: test_user
    password: test_password
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create

# Jwt

jwt:
  token:
    secret-key: test-TADG67STFSDAGSDFSG4567UTKJHFHSDFGSR231DF
    expire-length: 1800000 # 30 min
  refresh:
    secret-key: test-TADG67STFSDAGSDFSG4567UTKJHFHSDFGSR231DF
    expire-length: 1209600000 # 14 days

oauth:
  kakao:
    user-information-request-uri: https://kapi.kakao.com/v2/user/me
    access-token-request-uri: https://kauth.kakao.com/oauth/token
    rest-api-key: test-api-key
    client-secret: test-client-secret


cloud:
  aws:
    s3:
      bucket: kwantke
      image-base-uri: https://dev.tour.kr/
      origin-storage-path: tour/
      temporary-storage-paht: temporary/
      image-storage-path: images/