plugins {
  id 'java'
  id 'java-test-fixtures'
  id 'org.springframework.boot' version '3.5.10'
  id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.tour'
version = '0.0.1-SNAPSHOT'
description = 'tour'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
  configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  // Mysql
  runtimeOnly 'com.mysql:mysql-connector-j'

  // Flyway 추가
  implementation 'org.flywaydb:flyway-mysql'

  // Jwt
  implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

  // Redis
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'

  // Swagger
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

  // QueryDSL
  implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
  annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
  implementation "com.querydsl:querydsl-core"
  annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
  annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

  // S3
  implementation 'software.amazon.awssdk:s3:2.20.28'
  implementation 'software.amazon.awssdk:sts:2.20.28'
  implementation 'software.amazon.awssdk:auth:2.20.28'
  implementation 'io.findify:s3mock_2.13:0.2.6'

  // Log4j2
  implementation 'org.springframework.boot:spring-boot-starter-log4j2'

  // Prometheus
  implementation 'org.springframework.boot:spring-boot-starter-actuator'
  implementation 'io.micrometer:micrometer-registry-prometheus'

  // Test
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
  testImplementation "com.epages:restdocs-api-spec-mockmvc:0.18.2"
  testFixturesImplementation 'org.springframework.restdocs:spring-restdocs-restassured'
  testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
  testFixturesImplementation 'io.rest-assured:rest-assured:5.4.0'

  testFixturesImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  testImplementation 'io.rest-assured:rest-assured:5.5.0'

  testRuntimeOnly 'com.h2database:h2'
  testCompileOnly 'org.projectlombok:lombok'
  testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
  useJUnitPlatform()
}
